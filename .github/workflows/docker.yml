name: Build Push Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerforge-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  DOCKER_IMAGE: prabhakar7277/trackai-backend
  EB_APPLICATION: careerforge-ai
  EB_ENVIRONMENT: careerforge-ai-env

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:${{ github.sha }}" \
            -t "$DOCKER_IMAGE:latest" \
            .

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_IMAGE:${{ github.sha }}"
          docker push "$DOCKER_IMAGE:latest"

      - name: Create Elastic Beanstalk Bundle
        env:
          # This ARN identifies the AWS secret; it does not contain secret values.
          CAREERFORGE_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:334478198896:secret:careerforge/prod/app-rXikrM
        run: |
          mkdir -p deploy/.ebextensions

          cat > deploy/Dockerrun.aws.json << EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$DOCKER_IMAGE:${{ github.sha }}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "5000"
              }
            ]
          }
          EOF

          cat > deploy/.ebextensions/launch-template.config << EOF
          option_settings:
            aws:autoscaling:launchconfiguration:
              RootVolumeType: gp3
              DisableIMDSv1: true
          EOF

          cat > deploy/.ebextensions/environment-secrets.config << EOF
          option_settings:
            aws:elasticbeanstalk:application:environment:
              SPRING_PROFILES_ACTIVE: prod
            aws:elasticbeanstalk:application:environmentsecrets:
              CAREERFORGE_PROD_ENV_JSON: ${CAREERFORGE_SECRET_ARN}
          EOF

          cat > deploy/.ebextensions/health-check.config << EOF
          option_settings:
            aws:elasticbeanstalk:application:
              Application Healthcheck URL: /actuator/health/liveness

          EOF

          cd deploy
          zip -r ../careerforge-deploy.zip Dockerrun.aws.json .ebextensions

      - name: Recover Unresponsive Elastic Beanstalk App
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          INSTANCE_DETAILS="$(aws elasticbeanstalk describe-instances-health \
            --environment-name "$EB_ENVIRONMENT" \
            --attribute-names All \
            --region "$AWS_REGION" \
            --query 'InstanceHealthList[0].[InstanceId,HealthStatus]' \
            --output text 2>/dev/null || true)"
          read -r INSTANCE_ID INSTANCE_HEALTH <<< "$INSTANCE_DETAILS"
          HEALTH_CAUSES="$(aws elasticbeanstalk describe-instances-health \
            --environment-name "$EB_ENVIRONMENT" \
            --attribute-names All \
            --region "$AWS_REGION" \
            --query 'join(` | `, InstanceHealthList[0].Causes[].Message)' \
            --output text 2>/dev/null || true)"

          REPLACING_INSTANCE=false
          if [[ "$INSTANCE_HEALTH" == "No Data" || "$HEALTH_CAUSES" == *"No data received from the instance"* ]]; then
            if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
              echo "Elastic Beanstalk reports no health data but did not return an instance ID."
              exit 1
            fi

            echo "Replacing unresponsive instance ${INSTANCE_ID}; Auto Scaling will launch a fresh instance."
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id "$INSTANCE_ID" \
              --no-should-decrement-desired-capacity \
              --region "$AWS_REGION" >/dev/null
            REPLACING_INSTANCE=true
          fi

          RECOVERY_STATUS="Unknown"
          CURRENT_INSTANCE_ID="$INSTANCE_ID"
          CURRENT_INSTANCE_HEALTH="$INSTANCE_HEALTH"
          for recovery_attempt in $(seq 1 64); do
            RECOVERY_STATUS="$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" \
              --region "$AWS_REGION" \
              --query 'Environments[0].Status' \
              --output text)"
            CURRENT_DETAILS="$(aws elasticbeanstalk describe-instances-health \
              --environment-name "$EB_ENVIRONMENT" \
              --attribute-names All \
              --region "$AWS_REGION" \
              --query 'InstanceHealthList[0].[InstanceId,HealthStatus]' \
              --output text 2>/dev/null || true)"
            read -r CURRENT_INSTANCE_ID CURRENT_INSTANCE_HEALTH <<< "$CURRENT_DETAILS"
            echo "Recovery attempt ${recovery_attempt}/64: status=${RECOVERY_STATUS}, instance=${CURRENT_INSTANCE_ID:-pending}, health=${CURRENT_INSTANCE_HEALTH:-pending}"

            INSTANCE_READY=true
            if [[ "$REPLACING_INSTANCE" == "true" && "$CURRENT_INSTANCE_ID" == "$INSTANCE_ID" ]]; then
              INSTANCE_READY=false
            fi

            if [[ "$RECOVERY_STATUS" == "Ready" && "$INSTANCE_READY" == "true" && -n "$CURRENT_INSTANCE_ID" && "$CURRENT_INSTANCE_ID" != "None" && "$CURRENT_INSTANCE_HEALTH" != "No Data" ]]; then
              break
            fi
            sleep 15
          done

          if [[ "$RECOVERY_STATUS" != "Ready" || -z "$CURRENT_INSTANCE_ID" || "$CURRENT_INSTANCE_ID" == "None" || "$CURRENT_INSTANCE_HEALTH" == "No Data" ]]; then
            echo "Elastic Beanstalk instance did not recover within 16 minutes."
            exit 1
          fi


      - name: Deploy to Elastic Beanstalk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          VERSION_LABEL="careerforge-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          S3_BUCKET="$(aws elasticbeanstalk create-storage-location \
            --region "$AWS_REGION" \
            --query S3Bucket \
            --output text)"
          S3_KEY="deployments/${VERSION_LABEL}.zip"

          aws s3 cp careerforge-deploy.zip "s3://${S3_BUCKET}/${S3_KEY}" --region "$AWS_REGION"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${S3_BUCKET},S3Key=${S3_KEY}" \
            --region "$AWS_REGION"
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL" \
            --region "$AWS_REGION" >/dev/null

          echo "Waiting for ${VERSION_LABEL} to become healthy..."
          for attempt in $(seq 1 80); do
            read -r STATUS HEALTH CURRENT_VERSION < <(
              aws elasticbeanstalk describe-environments \
                --application-name "$EB_APPLICATION" \
                --environment-names "$EB_ENVIRONMENT" \
                --region "$AWS_REGION" \
                --query 'Environments[0].[Status,Health,VersionLabel]' \
                --output text
            )

            echo "Attempt ${attempt}/80: status=${STATUS}, health=${HEALTH}, version=${CURRENT_VERSION}"
            if [[ "$STATUS" == "Ready" && "$HEALTH" == "Green" && "$CURRENT_VERSION" == "$VERSION_LABEL" ]]; then
              exit 0
            fi

            # Once EB is Ready on the previous version, the deployment has
            # already rolled back. Fail immediately instead of waiting 20 min.
            if [[ "$attempt" -ge 12 && "$STATUS" == "Ready" && "$CURRENT_VERSION" != "$VERSION_LABEL" ]]; then
              echo "Elastic Beanstalk rolled back to ${CURRENT_VERSION}; target was ${VERSION_LABEL}."
              exit 1
            fi
            sleep 15
          done

          echo "Elastic Beanstalk did not become healthy within 20 minutes."
          exit 1

      - name: Verify Production Health
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 10 \
            "https://dr07bawk90aps.cloudfront.net/actuator/health/liveness?deployment=${{ github.run_id }}"

      - name: Print Elastic Beanstalk Diagnostics
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Recent Elastic Beanstalk events:"
          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --region "$AWS_REGION" \
            --max-items 40 \
            --query 'Events[*].[EventDate,Severity,Message]' \
            --output table || true

          echo "Instance health:"
          aws elasticbeanstalk describe-instances-health \
            --environment-name "$EB_ENVIRONMENT" \
            --attribute-names All \
            --region "$AWS_REGION" \
            --output table || true